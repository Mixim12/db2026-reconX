# =============================================================================
# TICKET-ADV148 — 7-service stack: backend, frontend, postgres, kafka, zookeeper,
#                prometheus, grafana (+ optional kafdrop behind "debug" profile)
# TICKET-ADV152 — Health checks gate dependent services
# =============================================================================
services:

  postgres:
    image: postgres:16-alpine
    container_name: reconx-postgres
    environment:
      POSTGRES_DB:       reconx
      POSTGRES_USER:     reconx_user
      POSTGRES_PASSWORD: reconx_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx_user -d reconx"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [reconx]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: reconx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      # `ruok` needs the 4lw allowlist; a plain TCP connect proves the client
      # port is accepting without touching broker config.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [reconx]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: reconx-kafka
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      # TICKET-ADV149 — the raw JMX port speaks RMI, which Prometheus cannot
      # scrape. The agent bundled with the image re-publishes the same MBeans
      # as Prometheus text on :9101, which is what the kafka-jmx job targets.
      KAFKA_OPTS: "-javaagent:/usr/share/java/cp-base-new/jmx_prometheus_javaagent-0.18.0.jar=9101:/etc/kafka/jmx-exporter.yml"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./monitoring/kafka/jmx-exporter.yml:/etc/kafka/jmx-exporter.yml:ro
    healthcheck:
      # KAFKA_OPTS is cleared for the CLI: it inherits the broker's javaagent
      # flag and dies trying to bind the already-taken exporter port 9101.
      test: ["CMD-SHELL", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [reconx]

  backend:
    build:
      # Repo root, not ./backend — backend/pom.xml depends on the sibling
      # recon-audit-starter module, which a backend/-scoped context cannot see.
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/sidoncode/reconx-backend:latest
    container_name: reconx-backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: uat
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB:   reconx
      POSTGRES_USER: reconx_user
      POSTGRES_PASSWORD: reconx_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-min!!}
    healthcheck:
      # 127.0.0.1, not localhost — busybox wget resolves localhost to ::1 first.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Liquibase applies the changesets inside this window (ADV151).
      start_period: 30s
    networks: [reconx]

  frontend:
    build: ./frontend
    image: ghcr.io/sidoncode/reconx-frontend:latest
    container_name: reconx-frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, and busybox wget
      # resolves localhost to ::1 first — which answers with connection refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reconx]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: reconx-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reconx]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: reconx-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [reconx]

  # Optional — bring up with `--profile debug`
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: reconx-kafdrop
    profiles: ["debug"]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/actuator/health || wget --spider -q http://127.0.0.1:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [reconx]

networks:
  reconx:

volumes:
  postgres_data:
  grafana_data:
