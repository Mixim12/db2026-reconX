# TICKET-ADV149 — Prometheus JMX exporter rules for the Kafka broker.
#
# The broker's raw JMX port speaks RMI, which Prometheus cannot scrape. The
# cp-kafka image ships jmx_prometheus_javaagent, which exposes the same MBeans
# over HTTP in Prometheus text format on port 9101 (see KAFKA_OPTS in
# docker-compose.yml).
lowercaseOutputName: true

rules:
  # Broker throughput / request rates: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec
  - pattern: 'kafka.server<type=(.+), name=(.+)PerSec><>Count'
    name: kafka_server_$1_$2_total
    type: COUNTER

  # Per-request-type latency: kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
  - pattern: 'kafka.network<type=RequestMetrics, name=(.+), request=(.+)><>Mean'
    name: kafka_network_request_$1_mean
    labels:
      request: "$2"
    type: GAUGE

  # Controller / replication health: under-replicated partitions, offline partitions.
  - pattern: 'kafka.server<type=ReplicaManager, name=(.+)><>Value'
    name: kafka_server_replicamanager_$1
    type: GAUGE

  - pattern: 'kafka.controller<type=KafkaController, name=(.+)><>Value'
    name: kafka_controller_$1
    type: GAUGE

  # JVM basics so the target is never metric-less.
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used'
    name: kafka_jvm_heap_used_bytes
    type: GAUGE
