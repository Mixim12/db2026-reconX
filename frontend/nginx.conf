# =============================================================================
# TICKET-ADV147 — nginx runtime config for the built SPA
#   * SPA fallback so client-side routes survive a hard refresh
#   * /api/ reverse proxy so the browser never leaves the origin (no CORS)
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown route -> index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to the backend service (docker-compose internal DNS).
    #
    # The upstream host goes through a variable on purpose. With a literal
    # `proxy_pass http://backend:8080/`, nginx resolves "backend" once at
    # startup and exits with `host not found in upstream` whenever the backend
    # container is not up yet — which is exactly what `docker run` of this
    # image on its own does. Through a variable, resolution is deferred to
    # request time via Docker's embedded DNS, so the image boots standalone and
    # the API proxy still works inside the compose network.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $reconx_backend backend;
        proxy_pass http://$reconx_backend:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;       # SSE (Day 7 /stream endpoint)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }
}
