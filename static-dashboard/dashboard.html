<!doctype html>
<!--
============================================================================
TICKET-ADV098 — Flexbox page shell (sidebar + header + main + footer)
TICKET-ADV099 — Semantic HTML5 (header/nav/main/section/article/aside/footer)
TICKET-ADV100 — ARIA roles + aria-live for the trade feed
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <h1 class="app-header__title">ReconX</h1>
    <nav class="app-header__nav" aria-label="Main navigation">
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="trades.html">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark theme" aria-pressed="false">🌗</button>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" role="complementary">
      <h2>Quick filters</h2>
      <ul>
        <li><a href="#">All trades</a></li>
        <li><a href="#">Open breaks</a></li>
        <li><a href="#">Today</a></li>
      </ul>
    </aside>

    <main class="app-main" role="main">
      <p class="alert alert--danger">Unmatched trades &gt; 0</p>

      <section aria-labelledby="kpi">
        <h2 id="kpi">Today at a glance</h2>
        <section class="dashboard-grid">
          <article class="stat-card"><h3 class="stat-card__label">Trades</h3><p class="stat-card__value">120</p></article>
          <article class="stat-card"><h3 class="stat-card__label">Matched</h3><p class="stat-card__value">105</p></article>
          <article class="stat-card stat-card--warn"><h3 class="stat-card__label">Open breaks</h3><p class="stat-card__value">15</p></article>
        </section>
      </section>

      <section aria-labelledby="feed">
        <h2 id="feed">Live trade feed <span id="sse-status" class="badge">Connecting…</span></h2>
        <!-- TICKET-ADV100 / ADV101 — section id="trade-feed" with aria-live for real-time announcements -->
        <section id="trade-feed" role="status" aria-live="polite" aria-atomic="false">
          <!-- Sample .trade-card elements for DevTools testing:
          <article class="trade-card trade-card--matched">
            <strong>EQU-20260603-0001</strong>
            <span> SAP.DE </span>
            <span> qty=1000 </span>
            <span> price=125.50 </span>
            <span> [MATCHED]</span>
          </article>
          <article class="trade-card trade-card--break">
            <strong>EQU-20260603-0002</strong>
            <span> AAPL </span>
            <span> qty=500 </span>
            <span> price=178.20 </span>
            <span> [BREAK]</span>
          </article>
          <article class="trade-card trade-card--pending">
            <strong>FX-20260603-0001</strong>
            <span> EUR/USD </span>
            <span> qty=1000000 </span>
            <span> price=1.0852 </span>
            <span> [PENDING]</span>
          </article>
          -->
        </section>
      </section>
    </main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
  </footer>

  <script src="js/sse.js"></script>
</body>
</html>
